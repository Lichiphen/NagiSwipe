image: alpine:latest

# The NagiLog customizing catalog: public selectors may only disappear with a history entry.
css-catalog:
  stage: test
  image: python:3.12-alpine
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git
  script:
    - git fetch --tags --force || true
    - python3 manga/dev/css_catalog_check.py

pages:
  stage: deploy
  script:
    # The pages are generated by site/build.py and committed; just copy them.
    - mkdir -p public/manga/docs
    - cp -r index.html nagiswipe.html nagimanga.html nagilog.html guide.html index.en.html nagiswipe.en.html nagimanga.en.html nagilog.en.html guide.en.html demo.html sitemap.xml _headers NagiSwipe-main.css NagiSwipe-main.js img site public/
    - rm -f public/site/build.py public/site/top.html public/site/top.en.html
    - cp -r manga/docs/images public/manga/docs/
  artifacts:
    paths:
      - public
  only:
    - main
