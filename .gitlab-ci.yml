image: alpine:latest

pages:
  stage: deploy
  script:
    # The pages are generated by site/build.py and committed; just copy them.
    - mkdir -p public/manga/docs
    - cp -r index.html nagiswipe.html nagimanga.html nagilog.html guide.html demo.html sitemap.xml NagiSwipe-main.css NagiSwipe-main.js img site public/
    - rm -f public/site/build.py public/site/top.html
    - cp -r manga/docs/images public/manga/docs/
  artifacts:
    paths:
      - public
  only:
    - main
