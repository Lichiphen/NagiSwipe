<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>NagiManga - タグ 1 つで、ブログに漫画ビューアー</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101316"/>
      <stop offset="1" stop-color="#1b2126"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.76" cy="0.46" r="0.52">
      <stop offset="0" stop-color="#7dbad6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7dbad6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tone" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="4.5" cy="4.5" r="1.9" fill="#1d1d1f"/>
    </pattern>
    <pattern id="toneLight" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="4" cy="4" r="1.1" fill="#1d1d1f"/>
    </pattern>
    <linearGradient id="gutter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#000" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Text -->
  <g font-family="'Yu Gothic UI','Yu Gothic','Hiragino Sans','Noto Sans JP',Meiryo,sans-serif">
    <text x="80" y="170" fill="#7dbad6" font-size="22" font-weight="700" letter-spacing="5">MANGA VIEWER FOR BLOGS</text>
    <text x="76" y="276" fill="#ffffff" font-size="108" font-weight="700" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" letter-spacing="-2">NagiManga</text>
    <text x="80" y="346" fill="#dfe6e9" font-size="36" font-weight="700">タグ 1 つで、</text>
    <text x="80" y="396" fill="#dfe6e9" font-size="36" font-weight="700">ブログに漫画ビューアー</text>

    <g font-size="21" font-weight="700" fill="#bfe0ee">
      <rect x="80" y="444" width="192" height="44" rx="22" fill="#7dbad6" fill-opacity="0.12" stroke="#7dbad6" stroke-opacity="0.55"/>
      <text x="176" y="473" text-anchor="middle">右から左・見開き</text>
      <rect x="286" y="444" width="104" height="44" rx="22" fill="#7dbad6" fill-opacity="0.12" stroke="#7dbad6" stroke-opacity="0.55"/>
      <text x="338" y="473" text-anchor="middle">縦読み</text>
      <rect x="404" y="444" width="164" height="44" rx="22" fill="#7dbad6" fill-opacity="0.12" stroke="#7dbad6" stroke-opacity="0.55"/>
      <text x="486" y="473" text-anchor="middle">パスワード公開</text>
      <rect x="582" y="444" width="112" height="44" rx="22" fill="#7dbad6" fill-opacity="0.12" stroke="#7dbad6" stroke-opacity="0.55"/>
      <text x="638" y="473" text-anchor="middle">DB 不要</text>
    </g>
    <text x="80" y="552" fill="#8a979e" font-size="20" font-weight="700" letter-spacing="1">by NagiSwipe ・ PHP mini CMS ・ EPUB import</text>
  </g>

  <!-- Book spread -->
  <g filter="url(#shadow)">
    <rect x="752" y="96" width="376" height="400" rx="4" fill="#f6f2e9"/>
  </g>
  <rect x="930" y="96" width="20" height="400" fill="url(#gutter)"/>

  <g fill="#fbf8f1" stroke="#1d1d1f" stroke-width="3.5" stroke-linejoin="round">
    <!-- right page (read first) -->
    <rect x="954" y="116" width="154" height="112"/>
    <rect x="954" y="116" width="154" height="112" fill="url(#toneLight)" stroke="none" opacity="0.55"/>
    <path d="M954 240 L1108 240 L1108 356 L954 330 Z"/>
    <rect x="954" y="342" width="72" height="134"/>
    <path d="M1036 344 L1108 368 L1108 476 L1036 476 Z"/>
    <path d="M1036 344 L1108 368 L1108 476 L1036 476 Z" fill="url(#tone)" stroke="none" opacity="0.35"/>
    <!-- left page -->
    <rect x="772" y="116" width="154" height="170"/>
    <rect x="772" y="298" width="72" height="178"/>
    <rect x="772" y="298" width="72" height="178" fill="url(#tone)" stroke="none" opacity="0.4"/>
    <rect x="854" y="298" width="72" height="178"/>
  </g>

  <!-- panel contents: speed lines, a face, a speech bubble -->
  <g stroke="#1d1d1f" stroke-linecap="round" fill="none">
    <g stroke-width="2" opacity="0.7">
      <line x1="776" y1="128" x2="846" y2="200"/>
      <line x1="776" y1="170" x2="846" y2="206"/>
      <line x1="776" y1="276" x2="846" y2="216"/>
      <line x1="922" y1="128" x2="856" y2="200"/>
      <line x1="922" y1="276" x2="856" y2="216"/>
      <line x1="849" y1="120" x2="849" y2="186"/>
    </g>
    <circle cx="851" cy="210" r="30" fill="#fbf8f1" stroke-width="3.5"/>
    <path d="M838 206 Q842 201 846 206 M856 206 Q860 201 864 206" stroke-width="3"/>
    <path d="M842 222 Q851 230 860 222" stroke-width="3"/>
    <path d="M1000 262 Q1030 250 1062 262 Q1090 276 1062 292 Q1030 304 1000 292 Q972 278 1000 262 Z" fill="#ffffff" stroke-width="3"/>
    <path d="M1018 298 L1010 318 L1036 300" fill="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g font-family="'Yu Gothic UI','Yu Gothic','Hiragino Sans',Meiryo,sans-serif" font-weight="700" fill="#1d1d1f">
    <text x="1031" y="284" font-size="22" text-anchor="middle">!!</text>
    <text x="1100" y="490" font-size="13" text-anchor="end" fill="#8b857a">1</text>
    <text x="780" y="490" font-size="13" fill="#8b857a">2</text>
  </g>

  <!-- reading direction -->
  <g font-family="'Yu Gothic UI','Yu Gothic','Hiragino Sans',Meiryo,sans-serif" font-weight="700">
    <path d="M1108 538 L786 538" stroke="#7dbad6" stroke-width="4" stroke-linecap="round"/>
    <path d="M802 524 L784 538 L802 552" fill="none" stroke="#7dbad6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="940" y="578" fill="#bfe0ee" font-size="20" text-anchor="middle">右から左へ めくる</text>
  </g>
</svg>
