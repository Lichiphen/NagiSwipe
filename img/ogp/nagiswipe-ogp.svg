<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>NagiSwipe - JS と CSS を読み込むだけの軽量な画像ポップアップ</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1316"/>
      <stop offset="1" stop-color="#15252e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#7dbad6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7dbad6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3b27a"/>
      <stop offset="0.55" stop-color="#e98f86"/>
      <stop offset="1" stop-color="#7a6ea8"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f6d9a"/>
      <stop offset="1" stop-color="#27385a"/>
    </linearGradient>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3e6"/>
      <stop offset="1" stop-color="#e3f1f4"/>
    </linearGradient>
    <clipPath id="screen"><rect x="782" y="96" width="276" height="438" rx="18"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Text -->
  <g font-family="'Yu Gothic UI','Yu Gothic','Hiragino Sans','Noto Sans JP',Meiryo,sans-serif">
    <text x="80" y="170" fill="#7dbad6" font-size="22" font-weight="700" letter-spacing="5">IMAGE POPUP GALLERY</text>
    <text x="76" y="276" fill="#ffffff" font-size="108" font-weight="700" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" letter-spacing="-2">NagiSwipe</text>
    <text x="80" y="346" fill="#dfe6e9" font-size="36" font-weight="700">JS と CSS を読み込むだけの</text>
    <text x="80" y="396" fill="#dfe6e9" font-size="36" font-weight="700">軽量な画像ポップアップ</text>

    <g font-size="21" font-weight="700" fill="#bfe0ee">
      <rect x="80" y="444" width="120" height="44" rx="22" fill="#7dbad6" fill-opacity="0.12" stroke="#7dbad6" stroke-opacity="0.55"/>
      <text x="140" y="473" text-anchor="middle">スワイプ</text>
      <rect x="214" y="444" width="164" height="44" rx="22" fill="#7dbad6" fill-opacity="0.12" stroke="#7dbad6" stroke-opacity="0.55"/>
      <text x="296" y="473" text-anchor="middle">ピンチズーム</text>
      <rect x="392" y="444" width="152" height="44" rx="22" fill="#7dbad6" fill-opacity="0.12" stroke="#7dbad6" stroke-opacity="0.55"/>
      <text x="468" y="473" text-anchor="middle">キャプション</text>
      <rect x="558" y="444" width="124" height="44" rx="22" fill="#7dbad6" fill-opacity="0.12" stroke="#7dbad6" stroke-opacity="0.55"/>
      <text x="620" y="473" text-anchor="middle">依存なし</text>
    </g>
    <text x="80" y="552" fill="#8a979e" font-size="20" font-weight="700" letter-spacing="1">MIT License ・ Mobile first ・ Drop-in</text>
  </g>

  <!-- Phone -->
  <g filter="url(#shadow)">
    <rect x="766" y="78" width="308" height="474" rx="34" fill="#0a0d0f" stroke="#2c3b44" stroke-width="2"/>
  </g>
  <rect x="782" y="96" width="276" height="438" rx="18" fill="#050607"/>

  <g clip-path="url(#screen)">
    <!-- previous image, sliding out to the left -->
    <g transform="translate(-196 0)">
      <rect x="782" y="200" width="276" height="220" fill="url(#sky2)"/>
      <path d="M782 380 L850 318 L902 352 L968 290 L1058 372 L1058 420 L782 420 Z" fill="#6f9c86"/>
      <path d="M782 420 L1058 420 L1058 396 Q920 372 782 400 Z" fill="#4f7d6a"/>
    </g>
    <!-- current image (sunset over the sea) -->
    <g transform="translate(70 0)">
      <rect x="782" y="200" width="276" height="220" fill="url(#sky)"/>
      <circle cx="930" cy="330" r="34" fill="#ffe2a8"/>
      <rect x="782" y="332" width="276" height="88" fill="url(#sea)"/>
      <g stroke="#ffe2a8" stroke-linecap="round" stroke-opacity="0.8">
        <line x1="906" y1="348" x2="954" y2="348" stroke-width="4"/>
        <line x1="914" y1="362" x2="946" y2="362" stroke-width="3"/>
        <line x1="922" y1="376" x2="938" y2="376" stroke-width="3"/>
      </g>
    </g>
  </g>

  <!-- viewer chrome -->
  <g font-family="'Segoe UI','Yu Gothic UI',Arial,sans-serif" font-weight="700">
    <text x="802" y="130" fill="#e9eef0" font-size="18">3 / 12</text>
    <g stroke="#e9eef0" stroke-width="2.5" stroke-linecap="round">
      <line x1="1026" y1="116" x2="1040" y2="130"/>
      <line x1="1040" y1="116" x2="1026" y2="130"/>
    </g>
    <rect x="782" y="470" width="276" height="64" fill="#000" fill-opacity="0.55"/>
    <text x="920" y="508" fill="#ffffff" font-size="20" text-anchor="middle" font-family="'Yu Gothic UI','Yu Gothic','Hiragino Sans',Meiryo,sans-serif">夕暮れの海</text>
  </g>

  <!-- swipe gesture -->
  <g>
    <path d="M1010 398 Q960 384 900 398" fill="none" stroke="#7dbad6" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14"/>
    <path d="M910 384 L894 399 L912 412" fill="none" stroke="#7dbad6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1030" cy="400" r="24" fill="#ffffff" fill-opacity="0.92"/>
    <circle cx="1030" cy="400" r="36" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
  </g>
</svg>
