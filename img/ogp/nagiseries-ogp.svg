<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>NagiSeries - 個人サイトのための、画像・漫画・LOG のツール集</title>
  <!-- Fonts: Morisawa A-OTF Shin Go Pro installed locally, referenced by name only (no font data here). Published as PNG. -->
  <style>
    @font-face { font-family: "SG"; src: local("ShinGoPro-Medium"), local("A-OTF Shin Go Pro M"); font-weight: 500; }
    @font-face { font-family: "SG"; src: local("ShinGoPro-Bold"), local("A-OTF Shin Go Pro B"); font-weight: 700; }
    @font-face { font-family: "SG"; src: local("ShinGoPro-Heavy"), local("A-OTF Shin Go Pro H"); font-weight: 900; }
    text { font-family: "SG", "Yu Gothic UI", "Hiragino Sans", sans-serif; }
    .tag { font-size: 16px; fill: #fff; }
    .tag-name { font-weight: 900; }
    .tag-kind { font-weight: 500; fill-opacity: .88; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1316"/>
      <stop offset="1" stop-color="#16303b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#7dbad6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7dbad6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="thumb"><rect width="360" height="189" rx="13"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- the waves of the mark, large and faint -->
  <g fill="none" stroke="#7dbad6" stroke-linecap="round" stroke-width="10">
    <path d="M-40 560 c 110 -90 220 -90 330 0 s 220 90 330 0 s 220 -90 330 0 s 220 90 330 0" opacity="0.07"/>
    <path d="M-40 610 c 110 -90 220 -90 330 0 s 220 90 330 0 s 220 -90 330 0 s 220 90 330 0" opacity="0.12"/>
  </g>

  <!-- mark + name -->
  <g transform="translate(80 92)">
    <rect width="64" height="64" rx="16" fill="#15252e" stroke="#7dbad6" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M12 26c6.6-7.2 13.4-7.2 20 0s13.4 7.2 20 0" fill="none" stroke="#7dbad6" stroke-width="5.2" stroke-linecap="round" opacity=".45"/>
    <path d="M12 38c6.6-7.2 13.4-7.2 20 0s13.4 7.2 20 0" fill="none" stroke="#7dbad6" stroke-width="5.2" stroke-linecap="round"/>
    <text x="84" y="40" fill="#7dbad6" font-size="20" font-weight="700" letter-spacing="4">TOOLS FOR PERSONAL WEBSITES</text>
  </g>
  <text x="74" y="268" fill="#ffffff" font-size="96" font-weight="900" letter-spacing="-1">NagiSeries</text>
  <text x="80" y="342" fill="#dfe6e9" font-size="36" font-weight="700">個人サイトのための、</text>
  <text x="80" y="394" fill="#dfe6e9" font-size="36" font-weight="700">画像・漫画・LOG のツール集</text>
  <g class="chips" font-size="19" font-weight="700" fill="#bfe0ee">
    <rect x="80" y="452" width="192" height="42" rx="21" fill="#7dbad6" fill-opacity="0.12" stroke="#7dbad6" stroke-opacity="0.5"/>
    <text x="176" y="480" text-anchor="middle">データベース不要</text>
    <rect x="284" y="452" width="173" height="42" rx="21" fill="#7dbad6" fill-opacity="0.12" stroke="#7dbad6" stroke-opacity="0.5"/>
    <text x="370.5" y="480" text-anchor="middle">置くだけで動く</text>
    <rect x="469" y="452" width="170" height="42" rx="21" fill="#7dbad6" fill-opacity="0.12" stroke="#7dbad6" stroke-opacity="0.5"/>
    <text x="554" y="480" text-anchor="middle">MIT License</text>
  </g>
  <text x="80" y="548" fill="#8a979e" font-size="19" font-weight="700" letter-spacing="1">NagiSwipe ・ NagiManga ・ NagiLog</text>

  <g transform="translate(800 384) rotate(4 180 94)" filter="url(#shadow)">
    <rect x="-5" y="-5" width="370" height="199" rx="18" fill="#2563eb"/>
    <image href="nagilog-ogp.png" x="0" y="0" width="360" height="189" clip-path="url(#thumb)" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <g transform="translate(752 216) rotate(-3 180 94)" filter="url(#shadow)">
    <rect x="-5" y="-5" width="370" height="199" rx="18" fill="#c2410c"/>
    <image href="nagimanga-ogp.png" x="0" y="0" width="360" height="189" clip-path="url(#thumb)" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <g transform="translate(800 50) rotate(3 180 94)" filter="url(#shadow)">
    <rect x="-5" y="-5" width="370" height="199" rx="18" fill="#1d7a8c"/>
    <image href="nagiswipe-ogp.png" x="0" y="0" width="360" height="189" clip-path="url(#thumb)" preserveAspectRatio="xMidYMid slice"/>
  </g>
</svg>
